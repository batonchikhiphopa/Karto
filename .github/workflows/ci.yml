name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  quality:
    name: TypeScript PWA
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck and unit tests
        run: npm test

      - name: Build PWA
        run: npm run build

      - name: Audit production dependencies
        run: npm run audit

      - name: Upload static bundle
        uses: actions/upload-artifact@v4
        with:
          name: karto-pwa
          path: dist
          if-no-files-found: error
